services:
  postgres:
    image: postgres:17
    container_name: momai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root@123
      POSTGRES_DB: momai_shop
    ports:
      - "5433:5432"
    volumes:
      - momai_pgdata:/var/lib/postgresql/data

volumes:
  momai_pgdata:
